<!doctype html>
<html lang="ru">
<head>

<title>Venture English</title>
<meta name="description" content="Тренажёр слов и выражений по учебнику English for Entrepreneurs (B1–B2), юниты 1–8.">
<meta name="theme-color" content="#F3F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1322" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Venture">
<meta name="format-detection" content="telephone=no">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one centred app column (max 600px) — the learning path runs down the middle, tabs are pinned to the bottom, lessons open as a full-screen layer */
:root {
  --bg: #F3F5FA;
  --surface: #FFFFFF;
  --surface-2: #E8ECF4;
  --ink: #141E36;
  --ink-2: #4E5871;
  --ink-3: #6F7891;
  --line: #D6DCE8;
  --spark: #FFB21E;
  --spark-deep: #CF8400;
  --on-spark: #2B1C00;
  --blue: #2D6BEA;
  --blue-soft: #E2EBFE;
  --ok: #23905D;
  --ok-soft: #DDF3E6;
  --ok-deep: #186B44;
  --on-ok: #FFFFFF;
  --bad: #D23E43;
  --bad-soft: #FCE4E5;
  --bad-deep: #A42B30;
  --on-bad: #FFFFFF;
  --u1: #0B7D70;
  --u1-deep: #075A51;
  --u1-soft: #DAF0EC;
  --u2: #C24E22;
  --u2-deep: #93391A;
  --u2-soft: #FBE6DC;
  --u3: #4A51C9;
  --u3-deep: #353BA0;
  --u3-soft: #E6E7FB;
  --u4: #8A6512;
  --u4-deep: #694B0C;
  --u4-soft: #F6ECD6;
  --u5: #3C7D2C;
  --u5-deep: #2C5E20;
  --u5-soft: #E2F1DC;
  --u6: #9A3B8C;
  --u6-deep: #742B69;
  --u6-soft: #F6E2F3;
  --u7: #0A6FA0;
  --u7-deep: #07547A;
  --u7-soft: #DDEFF8;
  --u8: #B53352;
  --u8-deep: #8A243D;
  --u8-soft: #FBE3E8;
  --lv0: #D9762F;
  --lv1: #E3A93A;
  --lv2: #A7BE45;
  --lv3: #5CB36A;
  --lv4: #23905D;
  --lv5: #145C3B;
  --on-unit: #FFFFFF;
  --shade: rgba(20, 30, 54, .45);
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-ipa: "Noto Sans", "Segoe UI", "Lucida Sans Unicode", "Arial Unicode MS", system-ui, sans-serif;
  --fs-xs: 12px; --fs-s: 14px; --fs-m: 16px; --fs-l: 18px; --fs-xl: 22px; --fs-2xl: 28px; --fs-3xl: 36px;
  --radius: 16px;
  --col: 600px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1322; --surface: #171E33; --surface-2: #222B45; --ink: #E9EDF7; --ink-2: #A9B2C9; --ink-3: #8790A8; --line: #2D3755;
    --spark: #FFC043; --spark-deep: #B98100; --on-spark: #241700;
    --blue: #74A3FF; --blue-soft: #1B2A4C;
    --ok: #4CC78B; --ok-soft: #12301F; --ok-deep: #2B8D5E; --on-ok: #062414;
    --bad: #FF7376; --bad-soft: #3B1A1D; --bad-deep: #C24C50; --on-bad: #2A0809;
    --u1: #2BB5A3; --u1-deep: #187468; --u1-soft: #13302D; --u2: #FF8A5C; --u2-deep: #B8552F; --u2-soft: #3A2117;
    --u3: #8F95FF; --u3-deep: #5A60C8; --u3-soft: #23264A; --u4: #E0B04A; --u4-deep: #A07A25; --u4-soft: #3A2E14; --u5: #7FCB68; --u5-deep: #4E8F3E; --u5-soft: #1D3218;
    --u6: #E07FD0; --u6-deep: #A54E97; --u6-soft: #3A1A35; --u7: #5CB8EA; --u7-deep: #2D84B3; --u7-soft: #12304A; --u8: #FF7D96; --u8-deep: #C24B63; --u8-soft: #3D1820;
    --lv0: #F0904A; --lv1: #F2C255; --lv2: #C2D86A; --lv3: #7CCB87; --lv4: #4CC78B; --lv5: #2FA36D;
    --on-unit: #0D1220; --shade: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1322; --surface: #171E33; --surface-2: #222B45; --ink: #E9EDF7; --ink-2: #A9B2C9; --ink-3: #8790A8; --line: #2D3755;
  --spark: #FFC043; --spark-deep: #B98100; --on-spark: #241700;
  --blue: #74A3FF; --blue-soft: #1B2A4C;
  --ok: #4CC78B; --ok-soft: #12301F; --ok-deep: #2B8D5E; --on-ok: #062414;
  --bad: #FF7376; --bad-soft: #3B1A1D; --bad-deep: #C24C50; --on-bad: #2A0809;
  --u1: #2BB5A3; --u1-deep: #187468; --u1-soft: #13302D; --u2: #FF8A5C; --u2-deep: #B8552F; --u2-soft: #3A2117;
  --u3: #8F95FF; --u3-deep: #5A60C8; --u3-soft: #23264A; --u4: #E0B04A; --u4-deep: #A07A25; --u4-soft: #3A2E14; --u5: #7FCB68; --u5-deep: #4E8F3E; --u5-soft: #1D3218;
  --u6: #E07FD0; --u6-deep: #A54E97; --u6-soft: #3A1A35; --u7: #5CB8EA; --u7-deep: #2D84B3; --u7-soft: #12304A; --u8: #FF7D96; --u8-deep: #C24B63; --u8-soft: #3D1820;
  --lv0: #F0904A; --lv1: #F2C255; --lv2: #C2D86A; --lv3: #7CCB87; --lv4: #4CC78B; --lv5: #2FA36D;
  --on-unit: #0D1220; --shade: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--fs-m)/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button { font: inherit; color: inherit; }
button, a, input { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.wrap { max-width: var(--col); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ico { width: 24px; height: 24px; flex: none; display: block; }
.ico.sm { width: 18px; height: 18px; }
.ico.lg { width: 34px; height: 34px; }
.muted { color: var(--ink-2); }
.small { font-size: var(--fs-s); }
.tabnum { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 2px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.logo { display: flex; align-items: center; gap: 8px; margin-right: auto; min-width: 0; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.logo > span:last-child { min-width: 0; }
.logo .bulb { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--spark); color: var(--on-spark); box-shadow: 0 3px 0 var(--spark-deep); }
.logo b { display: block; font: 700 15px/1.15 var(--font-display); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo small { display: block; font-size: 11px; color: var(--ink-3); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: var(--fs-s); font-variant-numeric: tabular-nums; cursor: pointer; }
.stat .ico { width: 20px; height: 20px; }
.stat.flame { color: var(--ink-3); }
.stat.flame.on { color: var(--u2); }
.stat.xp { color: var(--ink); }
.stat.xp .ico { color: var(--spark-deep); }

/* ---------- views ---------- */
main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.view { padding-block: 18px 12px; display: flex; flex-direction: column; gap: 18px; }
.view-head h1 { font: 700 var(--fs-xl)/1.2 var(--font-display); }
.view-head p { color: var(--ink-2); margin-top: 6px; font-size: var(--fs-s); }

/* ---------- tabs ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; padding-block: 6px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 1px; border-radius: 12px; border: 2px solid transparent; background: none; cursor: pointer; color: var(--ink-3); font-size: 11px; font-weight: 600; min-width: 0; }
.tab-l { display: block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab[aria-current="page"] { color: var(--blue); background: var(--blue-soft); border-color: var(--blue); }
.tab .badge { position: absolute; }
.tab-ico { position: relative; }
.tab-ico i { position: absolute; top: -4px; right: -9px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: var(--on-bad); font: 700 11px/18px var(--font-body); font-style: normal; text-align: center; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 18px; border-radius: 16px; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); color: var(--ink); font: 700 var(--fs-m)/1.2 var(--font-body); letter-spacing: .01em; cursor: pointer; text-decoration: none; transition: transform .06s; }
.btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
.btn.primary { background: var(--spark); color: var(--on-spark); border-color: var(--spark-deep); }
.btn.okb { background: var(--ok); color: var(--on-ok); border-color: var(--ok-deep); }
.btn.badb { background: var(--bad); color: var(--on-bad); border-color: var(--bad-deep); }
.btn.unit { background: var(--unit); color: var(--on-unit); border-color: var(--unit-deep); }
.btn:disabled { background: var(--surface-2); color: var(--ink-3); border-color: var(--line); cursor: default; }
.btn.slim { padding: 9px 14px; font-size: var(--fs-s); width: auto; border-radius: 12px; }
.linkbtn { background: none; border: 0; color: var(--blue); font-weight: 600; cursor: pointer; padding: 6px; text-decoration: underline; text-underline-offset: 3px; }
.iconbtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); border-bottom-width: 3px; background: var(--surface); color: var(--blue); cursor: pointer; flex: none; padding: 0; }
.iconbtn.big { width: 64px; height: 64px; border-radius: 18px; background: var(--blue); color: var(--surface); border-color: var(--blue); box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
.iconbtn.big .ico { width: 30px; height: 30px; }
.iconbtn:active { transform: translateY(1px); }

/* ---------- learning path ---------- */
.u1 { --unit: var(--u1); --unit-deep: var(--u1-deep); --unit-soft: var(--u1-soft); }
.u2 { --unit: var(--u2); --unit-deep: var(--u2-deep); --unit-soft: var(--u2-soft); }
.u3 { --unit: var(--u3); --unit-deep: var(--u3-deep); --unit-soft: var(--u3-soft); }
.u4 { --unit: var(--u4); --unit-deep: var(--u4-deep); --unit-soft: var(--u4-soft); }
.u5 { --unit: var(--u5); --unit-deep: var(--u5-deep); --unit-soft: var(--u5-soft); }
.u6 { --unit: var(--u6); --unit-deep: var(--u6-deep); --unit-soft: var(--u6-soft); }
.u7 { --unit: var(--u7); --unit-deep: var(--u7-deep); --unit-soft: var(--u7-soft); }
.u8 { --unit: var(--u8); --unit-deep: var(--u8-deep); --unit-soft: var(--u8-soft); }
.unit-band { background: var(--unit); color: var(--on-unit); border-radius: 20px; padding: 16px 18px; box-shadow: 0 4px 0 var(--unit-deep); display: grid; gap: 6px; }
.unit-band h2 { font: 700 19px/1.25 var(--font-display); }
.unit-band p { font-size: var(--fs-s); opacity: .92; }
.unit-meter { height: 10px; border-radius: 6px; background: rgba(0, 0, 0, .18); overflow: hidden; margin-top: 6px; }
.unit-meter span { display: block; height: 100%; background: var(--on-unit); border-radius: 6px; opacity: .9; }
.unit-row { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-xs); font-weight: 600; opacity: .95; font-variant-numeric: tabular-nums; }
.path { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 58px 0 30px; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 150px; background: none; border: 0; padding: 0; cursor: pointer; transform: translateX(var(--x, 0)); }
.disc { position: relative; width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); box-shadow: 0 6px 0 var(--line); transition: transform .08s, box-shadow .08s; }
.disc .ico { width: 32px; height: 32px; }
.node:active .disc { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }
.node.started .disc, .node.done .disc { background: var(--unit); color: var(--on-unit); box-shadow: 0 6px 0 var(--unit-deep); }
.node.gold .disc { background: var(--spark); color: var(--on-spark); box-shadow: 0 6px 0 var(--spark-deep); }
.node.ex .disc { border-radius: 22px; }
.node.check .disc { width: 80px; height: 80px; border-radius: 24px; }
.ring { position: absolute; inset: -8px; border-radius: 50%; background: conic-gradient(var(--unit) calc(var(--p, 0) * 1turn), transparent 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px)); pointer-events: none; }
.node.ex .ring, .node.check .ring { border-radius: 28px; }
.node-label { font-size: 13px; line-height: 1.25; font-weight: 600; color: var(--ink-2); text-align: center; max-width: 150px; }
.node.current .node-label { color: var(--ink); }
.bubble { position: absolute; top: -38px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--surface); color: var(--unit); border: 2px solid var(--line); border-radius: 12px; padding: 5px 12px; font: 700 12px/1.2 var(--font-display); letter-spacing: .04em; text-transform: uppercase; animation: bob 1.8s ease-in-out infinite; z-index: 2; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
@keyframes bob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -5px); } }

/* ---------- sheet / modal ---------- */
.shade { position: fixed; inset: 0; z-index: 60; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out; }
.sheet { width: 100%; max-width: var(--col); background: var(--surface); border-radius: 22px 22px 0 0; border-top: 2px solid var(--line); padding: 20px max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; animation: rise .2s ease-out; max-height: 88vh; overflow: auto; }
.sheet h3 { font: 700 var(--fs-l)/1.25 var(--font-display); }
.sheet .meta { color: var(--ink-2); font-size: var(--fs-s); }
.sheet .eyebrow { color: var(--unit, var(--ink-3)); }
.sheet-actions { display: grid; gap: 10px; margin-top: 4px; }
.meter { height: 12px; border-radius: 7px; background: var(--surface-2); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--unit, var(--ok)); border-radius: 7px; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(30px); opacity: .6; } }

/* ---------- lesson layer ---------- */
.lesson { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.l-head { flex: none; }
.l-head .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px 6px; }
.l-close { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: none; border: 0; color: var(--ink-3); cursor: pointer; }
.l-bar { flex: 1; height: 16px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.l-bar span { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 9px; transition: width .35s ease; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08); }
.hearts { display: flex; align-items: center; gap: 4px; color: var(--bad); font-weight: 700; font-variant-numeric: tabular-nums; }
.hearts.off { display: none; }
.l-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.l-body > .wrap { padding-block: 14px 28px; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
.l-foot { flex: none; border-top: 2px solid var(--line); background: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); transition: background .15s; }
.l-foot .wrap { display: grid; gap: 12px; padding-block: 14px 16px; }
.l-foot.ok { background: var(--ok-soft); border-color: transparent; }
.l-foot.bad { background: var(--bad-soft); border-color: transparent; }
.fb { display: flex; gap: 12px; align-items: flex-start; }
.fb-mark { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface); }
.l-foot.ok .fb-mark { color: var(--ok); }
.l-foot.bad .fb-mark { color: var(--bad); }
.fb-text { min-width: 0; }
.fb-text strong { display: block; font: 700 var(--fs-l)/1.25 var(--font-display); }
.l-foot.ok .fb-text strong { color: var(--ok-deep); }
.l-foot.bad .fb-text strong { color: var(--bad-deep); }
.fb-ans { margin-top: 4px; font-size: var(--fs-m); color: var(--ink); overflow-wrap: anywhere; }
.fb-ans .lbl { color: var(--ink-2); }
.fb-sub { margin-top: 2px; font-size: var(--fs-s); color: var(--ink-2); }
:root[data-theme="dark"] .l-foot.ok .fb-text strong, :root[data-theme="dark"] .l-foot.bad .fb-text strong { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .l-foot.ok .fb-text strong { color: var(--ok); } :root:not([data-theme="light"]) .l-foot.bad .fb-text strong { color: var(--bad); } }
.foot-row { display: flex; gap: 10px; align-items: center; }
.foot-row .btn { flex: 1; }

.ch-title { font: 700 var(--fs-xl)/1.25 var(--font-display); }
.ch-sub { color: var(--ink-2); font-size: var(--fs-s); margin-top: -8px; }
.prompt { display: flex; align-items: center; gap: 14px; padding: 4px 0; }
.prompt .big { font-size: var(--fs-xl); font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; min-width: 0; }
.prompt .big b, .en b { color: var(--blue); font-weight: 700; }
.prompt-card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 8px; }
.prompt-card .big { font-size: var(--fs-xl); font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.prompt-card .def { color: var(--ink); font-size: var(--fs-l); line-height: 1.4; }
.lbl { color: var(--ink-3); font-weight: 500; font-size: .82em; }
.gap { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--blue); color: var(--blue); text-align: center; font-weight: 700; padding: 0 4px; }
.gap.g-ok { color: var(--ok); border-color: var(--ok); }
.gap.g-bad { color: var(--bad); border-color: var(--bad); }
.l-foot .chips { max-height: 32vh; overflow-y: auto; padding: 2px; }
.l-foot .chips .chip { padding: 6px 10px; font-size: 13px; }
.l-foot .chips .chip:disabled { opacity: .3; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.tag.new { color: var(--u2); }
.basechip { display: inline-block; font: 700 var(--fs-s)/1 var(--font-display); letter-spacing: .06em; padding: 8px 10px; border-radius: 10px; background: var(--blue-soft); color: var(--blue); }

/* intro card */
.intro { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 20px 18px; display: grid; gap: 12px; }
.intro .en { font-size: var(--fs-2xl); font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.intro .ru { font-size: var(--fs-l); color: var(--ink); }
.intro .ipa { font-family: var(--font-ipa); font-size: var(--fs-l); color: var(--ink-2); }
.intro .def { color: var(--ink-2); font-size: var(--fs-s); border-left: 3px solid var(--line); padding-left: 10px; }
.intro .ex { font-style: italic; color: var(--ink-2); font-size: var(--fs-s); }
.intro .from { font-size: var(--fs-xs); color: var(--ink-3); }

/* options */
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 14px; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; font-size: var(--fs-m); line-height: 1.35; font-weight: 500; cursor: pointer; color: var(--ink); transition: transform .05s; }
.opt:active { transform: translateY(2px); border-bottom-width: 2px; }
.opt kbd { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font: 700 12px/1 var(--font-body); color: var(--ink-3); }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.opt.sel { border-color: var(--blue); background: var(--blue-soft); }
.opt.sel kbd { border-color: var(--blue); color: var(--blue); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.ipa span { font-family: var(--font-ipa); }
.opts.locked .opt { pointer-events: none; }
.opts.tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opts.tiles .opt { justify-content: center; text-align: center; font-weight: 700; font-size: var(--fs-l); }
.opts.tiles .opt kbd { display: none; }

/* listen */
.listen-row { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px 0 4px; }
.slowbtn { width: 48px; height: 48px; border-radius: 14px; }
.cantlisten { justify-self: center; font-size: var(--fs-s); }

/* text input */
.inp { width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: 500 var(--fs-l)/1.3 var(--font-body); }
.inp:focus { outline: none; border-color: var(--blue); }
.inp.right { border-color: var(--ok); background: var(--ok-soft); }
.inp.wrong { border-color: var(--bad); background: var(--bad-soft); }
.hintline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: var(--fs-s); color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line); border-bottom-width: 3px; background: var(--surface); font-weight: 600; font-size: var(--fs-s); cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.chip:disabled { opacity: .35; cursor: default; }

/* word bank */
.build-line { min-height: 64px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding: 6px 0 12px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-top: 8px; }
.wtile { padding: 9px 13px; border-radius: 12px; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); font-weight: 600; font-size: var(--fs-m); cursor: pointer; color: var(--ink); }
.wtile.ghost { background: var(--surface-2); border-color: var(--surface-2); color: transparent; pointer-events: none; }
.build-line.right { border-color: var(--ok); }
.build-line.wrong { border-color: var(--bad); }

/* matching */
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.match.wide { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); }
.match-col { display: grid; gap: 10px; align-content: start; }
.mtile { min-height: 54px; padding: 10px 10px; border-radius: 14px; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); font-weight: 600; font-size: var(--fs-s); line-height: 1.3; cursor: pointer; text-align: center; color: var(--ink); overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
.mtile.long { font-size: 12.5px; }
.match.wide .match-col:last-child .mtile { text-align: left; font-weight: 500; }
.mtile.sel { border-color: var(--blue); background: var(--blue-soft); }
.mtile.done { border-color: var(--ok); background: var(--ok-soft); color: var(--ok-deep); opacity: .55; pointer-events: none; }
.mtile.no { border-color: var(--bad); background: var(--bad-soft); animation: shake .3s; }
.mtile.gone { visibility: hidden; }
:root[data-theme="dark"] .mtile.done { color: var(--ok); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mtile.done { color: var(--ok); } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* gap text */
.gaptext { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; font-size: var(--fs-m); line-height: 2.1; }
.gaptext h3 { font: 700 var(--fs-m)/1.3 var(--font-display); margin-bottom: 6px; }
.gbtn { display: inline-flex; align-items: center; min-width: 5.5em; justify-content: center; padding: 0 8px; margin: 0 2px; height: 32px; vertical-align: middle; border-radius: 9px; border: 2px dashed var(--line); background: var(--surface-2); font: 600 var(--fs-s)/1 var(--font-body); color: var(--ink); cursor: pointer; }
.gbtn.active { border-color: var(--blue); border-style: solid; background: var(--blue-soft); }
.gbtn.filled { border-style: solid; background: var(--surface); }
.gbtn.right { border-color: var(--ok); background: var(--ok-soft); }
.gbtn.wrong { border-color: var(--bad); background: var(--bad-soft); }
.gbtn small { margin-left: 6px; color: var(--ok-deep); font-weight: 700; }
.gnum { font-size: 10px; color: var(--ink-3); margin-right: 4px; }

/* flashcards */
.flash { perspective: 900px; }
.flash-card { position: relative; min-height: 260px; border-radius: 22px; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 5px; display: grid; place-items: center; text-align: center; padding: 22px; cursor: pointer; gap: 10px; }
.flash-card .en { font-size: var(--fs-2xl); font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.flash-card .ru { font-size: var(--fs-l); }
.flash-card .tap { font-size: var(--fs-xs); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }

/* results */
.results { display: grid; gap: 18px; justify-items: center; text-align: center; padding-top: 18px; }
.res-art { width: 96px; height: 96px; border-radius: 30px; display: grid; place-items: center; background: var(--spark); color: var(--on-spark); box-shadow: 0 6px 0 var(--spark-deep); animation: pop .5s ease-out; }
.res-art .ico { width: 54px; height: 54px; }
.res-art.sad { background: var(--surface-2); color: var(--bad); box-shadow: 0 6px 0 var(--line); }
.results h2 { font: 700 var(--fs-2xl)/1.2 var(--font-display); }
.tiles3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.rtile { border-radius: 16px; border: 2px solid var(--line); overflow: hidden; background: var(--surface); }
.rtile .k { display: block; font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 6px 4px; background: var(--surface-2); color: var(--ink-2); }
.rtile b { display: block; font: 700 var(--fs-xl)/1.2 var(--font-display); padding: 10px 4px 12px; font-variant-numeric: tabular-nums; }
.rtile.xp b { color: var(--spark-deep); }
.rtile.acc b { color: var(--ok); }
.rtile.time b { color: var(--blue); }
.goal-banner { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; border-radius: 16px; background: var(--u2-soft); color: var(--ink); border: 2px solid var(--u2); }
.goal-banner .ico { color: var(--u2); width: 30px; height: 30px; }
.reslist { width: 100%; display: grid; gap: 6px; text-align: left; }
.reslist .row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--surface); border: 2px solid var(--line); font-size: var(--fs-s); }
.reslist .row .en { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }

/* strength bars */
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 16px; flex: none; }
.bars i { width: 4px; border-radius: 2px; background: var(--line); }
.bars i:nth-child(1) { height: 6px; } .bars i:nth-child(2) { height: 9px; } .bars i:nth-child(3) { height: 12px; } .bars i:nth-child(4) { height: 16px; }
.bars i.on { background: var(--ok); }

/* cards / lists */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.card h3 { font: 700 var(--fs-m)/1.3 var(--font-display); }
.card .row { display: flex; align-items: center; gap: 12px; }
.card .row > .grow { min-width: 0; flex: 1; }
.mode-ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--blue-soft); color: var(--blue); }
.mode-ico.spark { background: var(--spark); color: var(--on-spark); }
.mode-ico.u1, .mode-ico.u2, .mode-ico.u3, .mode-ico.u4, .mode-ico.u5, .mode-ico.u6, .mode-ico.u7, .mode-ico.u8 { background: var(--unit-soft); color: var(--unit); }
.mode-ico.bad { background: var(--bad-soft); color: var(--bad); }
.hero-review { background: var(--blue); color: var(--surface); border: 0; border-bottom: 5px solid rgba(0,0,0,.25); }
.hero-review h3 { font-size: var(--fs-l); }
.hero-review p { opacity: .9; }
.hero-review .btn { background: var(--surface); color: var(--blue); border-color: rgba(0,0,0,.18); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.hero-tr { border-color: var(--spark); border-bottom: 5px solid var(--spark-deep); }
.hero-tr h3 { font-size: var(--fs-l); }
.hero-tr p { color: var(--ink-2); }

/* dictionary */
.searchbox { position: relative; }
.searchbox .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.searchbox input { padding-left: 46px; font-size: var(--fs-m); }
.dict-count { font-size: var(--fs-s); color: var(--ink-2); }
.dsec { display: grid; gap: 8px; }
.dsec-h { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 5; background: var(--bg); padding: 8px 0 6px; display: flex; gap: 8px; align-items: baseline; justify-content: space-between; border-bottom: 2px solid var(--line); }
.dsec-h h3 { font: 700 var(--fs-s)/1.3 var(--font-display); }
.dsec-h span { font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; }
.dgroup { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; margin-top: 6px; }
.entry { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; }
.entry-row { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; }
.entry-main { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--ink); }
.entry-main .en { font-weight: 600; overflow-wrap: anywhere; display: block; }
.entry-main .ru { font-size: var(--fs-s); color: var(--ink-2); display: block; margin-top: 2px; }
.entry-side { display: flex; align-items: center; gap: 6px; }
.say { width: 36px; height: 36px; border-radius: 11px; }
.say .ico { width: 20px; height: 20px; }
.fav { background: none; border: 0; color: var(--ink-3); width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; border-radius: 10px; padding: 0; }
.fav[aria-pressed="true"] { color: var(--spark-deep); }
.entry-more { padding: 0 12px 12px; display: grid; gap: 6px; font-size: var(--fs-s); color: var(--ink-2); }
.entry-more .ipa { font-family: var(--font-ipa); color: var(--ink); }
.entry-more em { color: var(--ink); }
.xbadge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); margin-left: 6px; vertical-align: 2px; }
.empty { text-align: center; color: var(--ink-2); padding: 30px 10px; }

/* book */
.exrow { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: var(--surface); border: 2px solid var(--line); width: 100%; text-align: left; color: var(--ink); }
button.exrow { cursor: pointer; border-bottom-width: 4px; }
button.exrow:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
.exrow .go { color: var(--ink-3); flex: none; }
.exrow > div { flex: 1; min-width: 0; }
.exrow b { display: block; font-weight: 700; }
.excode { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font: 700 13px/1 var(--font-display); background: var(--unit-soft); color: var(--unit); flex: none; }
.score { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.score.good { color: var(--ok); }
.vlink { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 2px solid var(--line); color: var(--ink); text-decoration: none; }
.vlink > div { min-width: 0; flex: 1; }
.vlink b { display: block; font-weight: 600; font-size: var(--fs-s); }
.vlink small { color: var(--ink-3); }
.unit-h { display: flex; align-items: center; gap: 10px; }
.unit-h .dot { width: 12px; height: 12px; border-radius: 4px; background: var(--unit); flex: none; }
.unit-h h2 { font: 700 var(--fs-m)/1.3 var(--font-display); }

/* profile */
.stats4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stile { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 16px; background: var(--surface); border: 2px solid var(--line); }
.stile b { display: block; font: 700 var(--fs-l)/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.stile span { font-size: var(--fs-xs); color: var(--ink-2); }
.stile .ico { width: 28px; height: 28px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 150px; padding-top: 18px; position: relative; }
.wcol { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.wbar { width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px; background: var(--blue); min-height: 3px; position: relative; }
.wbar.zero { background: var(--surface-2); }
.wbar.hit { background: var(--spark); }
.wcol small { font-size: var(--fs-xs); line-height: 16px; height: 16px; color: var(--ink-3); font-weight: 600; }
.wcol .v { font-size: 11px; line-height: 14px; height: 14px; color: var(--ink-2); font-weight: 700; font-variant-numeric: tabular-nums; }
.goal-line { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--spark-deep); pointer-events: none; }
.week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.legend { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); }
.legend i { display: inline-block; width: 18px; border-top: 2px dashed var(--spark-deep); }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
.setrow > span { min-width: 0; }
.setrow.stack { flex-direction: column; align-items: flex-start; gap: 8px; }
.switch { position: relative; width: 52px; height: 30px; border-radius: 15px; border: 2px solid var(--line); background: var(--surface-2); cursor: pointer; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--ok); border-color: var(--ok-deep); }
.switch[aria-checked="true"]::after { left: 24px; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.badge-a { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); }
.badge-a .mode-ico { width: 36px; height: 36px; border-radius: 11px; background: var(--surface-2); color: var(--ink-3); }
.badge-a.on { color: var(--ink); }
.badge-a.on .mode-ico { background: var(--spark); color: var(--on-spark); }
.sync { display: flex; gap: 10px; align-items: flex-start; font-size: var(--fs-s); color: var(--ink-2); }
.sync .ico { color: var(--ok); }
.sync.local .ico { color: var(--ink-3); }

/* sprint */
.sprint-top { display: flex; align-items: center; gap: 12px; }
.sprint-time { flex: 1; height: 14px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.sprint-time span { display: block; height: 100%; background: var(--spark); border-radius: 8px; }
.sprint-score { font: 700 var(--fs-xl)/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: var(--fs-s); max-width: calc(100% - 32px); animation: rise .2s ease-out; }

/* ---------- unit picker ---------- */
.unitsbar { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 16px; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; }
.unitsbar:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
.ub-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--blue-soft); color: var(--blue); }
.ub-text { flex: 1; min-width: 0; display: grid; gap: 4px; }
.ub-text b { font-weight: 700; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.ub-text small { font-size: var(--fs-xs); color: var(--ink-2); }
.ub-dots { display: flex; gap: 4px; }
.ub-dots i { width: 16px; height: 6px; border-radius: 3px; background: var(--line); }
.ub-dots i.on { background: var(--unit); }
.ub-act { display: flex; align-items: center; gap: 2px; flex: none; color: var(--blue); font-weight: 700; font-size: 13px; }
.ulist { display: grid; gap: 8px; }
.urow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; }
.urow[aria-pressed="true"] { border-color: var(--unit); background: var(--unit-soft); }
.ucheck { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; color: transparent; background: var(--surface); }
.urow[aria-pressed="true"] .ucheck { background: var(--unit); border-color: var(--unit); color: var(--on-unit); }
.utext { flex: 1; min-width: 0; }
.utext b { display: block; font-size: var(--fs-s); line-height: 1.3; }
.utext small { display: block; font-size: var(--fs-xs); color: var(--ink-2); margin-top: 2px; }

/* ---------- word levels ---------- */
.lvdots { display: inline-flex; gap: 3px; align-items: center; flex: none; }
.lvdots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.lvdots i.on { background: var(--ok); }
.lvdots.max i.on { background: var(--spark-deep); }
.fb-lv { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tr-tag { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tr-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.lvbar { display: flex; height: 14px; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
.lvbar span { display: block; height: 100%; min-width: 3px; }
.lvbar .l0, .lvlegend i.l0 { background: var(--lv0); }
.lvbar .l1, .lvlegend i.l1 { background: var(--lv1); }
.lvbar .l2, .lvlegend i.l2 { background: var(--lv2); }
.lvbar .l3, .lvlegend i.l3 { background: var(--lv3); }
.lvbar .l4, .lvlegend i.l4 { background: var(--lv4); }
.lvbar .l5, .lvlegend i.l5 { background: var(--lv5); }

R.build = (ch, main) => {
  const c = ch.c; if (!c.tokens) return R.mcEN(ch, main);
  const own = new Set(c.tokens.map(t => t.toLowerCase()));
  const extra = [];
  for (const x of shuffle(CARDS.filter(x => x.unit === c.unit && x.tokens && x !== c))) {
    for (const t of x.tokens) if (!own.has(t.toLowerCase()) && !extra.includes(t) && t.length > 1 && extra.length < 3) extra.push(t);
    if (extra.length >= 3) break;
  }
  const bank = shuffle(c.tokens.map((t, i) => ({ t, k: "a" + i })).concat(extra.map((t, i) => ({ t, k: "b" + i }))));
  main.append(node(`<h2 class="ch-title">Соберите перевод</h2>`));

    line.innerHTML = ""; bk.innerHTML = "";

    setReady(chosen.length > 0);
  };
  draw();
  L.check = () => {
    const got = normT(chosen.map(t => t.t).join(" ")), want = normT(c.tokens.join(" "));
    const ok = got === want; line.classList.add(ok ? "right" : "wrong");
    return { ok, answer: c.clean, answerHTML: enHTML(c.en) };

};
function matchBoard(main, left, right, onPair, wide) {
  const wrapEl = node(`<div class="match ${wide ? "wide" : ""}"><div class="match-col"></div><div class="match-col"></div></div>`);
  const [colL, colR] = $$(".match-col", wrapEl);
  let selL = null, selR = null, doneN = 0;
  const mkTile = (it, side) => {
    const longest = Math.max(...it.html.replace(/<[^>]+>/g, "").split(/\s+/).map(w => w.length));
    const b = node(`<button class="mtile ${longest > 13 ? "long" : ""}" type="button" lang="${it.lang || (side === "L" ? "en" : "ru")}">${it.html}</button>`);
    b.onclick = () => {
      if (b.classList.contains("done")) return;
      if (side === "L") { if (selL) selL.el.classList.remove("sel"); selL = { it, el: b }; }
      else { if (selR) selR.el.classList.remove("sel"); selR = { it, el: b }; }
      b.classList.add("sel");
      if (side === "L" && it.say) Speech.say(it.say);
      if (selL && selR) {
        const a = selL, z = selR; selL = selR = null;
        if (a.it.key === z.it.key) {
          a.el.classList.remove("sel"); z.el.classList.remove("sel"); a.el.classList.add("done"); z.el.classList.add("done");
          Sfx.play("tap"); doneN++; onPair(true, a.it, z.it, doneN);
        } else {
          [a.el, z.el].forEach(x => { x.classList.remove("sel"); x.classList.add("no"); setTimeout(() => x.classList.remove("no"), 420); });
          Sfx.play("bad"); onPair(false, a.it, z.it, doneN);
        }
      }
    };
    return b;
  };
  left.forEach(it => colL.append(mkTile(it, "L")));
  right.forEach(it => colR.append(mkTile(it, "R")));
  main.append(wrapEl);
  const all = $$(".mtile", wrapEl);
  L.keys = k => { const b = all[(k === 0 ? 10 : k) - 1]; if (b) b.click(); };
  return wrapEl;
}

/* ================= translation trainer ================= */
const TR_DEF = { dir: "en", mode: "auto", scope: "all", n: 15 };
const trSet = () => Object.assign({}, TR_DEF, P.set.tr || {});
const isPV = c => !!c.pv || /\(phr v\)/.test(c.en);
const trKey = s => s.toLowerCase().replace(/^to /, "").replace(/\b(sb|sth|one’s|one's)\b/g, " ").replace(/[()]/g, " ").replace(/\s+/g, " ").trim();
/* trainer words: the selected units' glossary; pronunciation-drill words only when the glossary has no entry with the same headword */
function trBase() {
  const keys = new Set();
  ACT.forEach(c => { if (c.pron) return; keys.add(c.unit + "|" + trKey(c.clean)); const head = c.clean.split(/\s+[=≠—]\s+/)[0]; if (head !== c.clean) keys.add(c.unit + "|" + trKey(head)); });
  return ACT.filter(c => !c.pron || !keys.has(c.unit + "|" + trKey(c.clean)));
}
const TR_SCOPES = [
  ["all", "Все", () => true],
  ["words", "Слова", c => !/\s/.test(c.clean.replace(/^to /, ""))],
  ["phr", "Выражения", c => !isPV(c) && /\s/.test(c.clean.replace(/^to /, ""))],
  ["pv", "Фразовые глаголы", isPV],
  ["new", "Новые", c => !rec(c)],
  ["mis", "Ошибки", c => misCount(c) > 0 && rec(c).b < 4],
  ["fav", "Избранное", isFav]
];
/* weaker, due and often-missed words come first; brand-new words are mixed in; everything is shuffled */
function trPick(scope, n) {
  const sc = TR_SCOPES.find(x => x[0] === scope) || TR_SCOPES[0];
  const pool = trBase().filter(sc[2]);
  if (scope === "mis") return shuffle(pool.sort(byMistakes).slice(0, n));
  const now = Date.now();
  const score = c => {
    const r = rec(c);
    if (!r) return 2 + Math.random() * 3;
    let s = r.b + Math.random() * 2.5;
    if (r.d <= now) s -= 1.5;
    if (r.w) s -= Math.min(2, r.w * 0.5);
    if (now - (r.t || 0) < 20 * 60e3) s += 4;
    return s;
  };
  return shuffle(pool.map(c => [score(c), c]).sort((a, b) => a[0] - b[0]).slice(0, n).map(x => x[1]));
}
function trChallenge(c, set) {
  const r = rec(c);
  const dir = set.dir === "mix" ? (Math.random() < 0.5 ? "en" : "ru") : set.dir === "ru" ? "ru" : "en";
  const wantType = set.mode === "type" || (set.mode === "auto" && !!r && r.b >= 2);
  return { t: "tr", tr: true, c, dir, typed: wantType && (dir === "en" || c.canType) };
}
function startTrainer(over) {
  const set = Object.assign(trSet(), over || {});
  const first = trPick(set.scope, set.n);
  if (!first.length) { toast("В этом наборе пока нет слов"); return; }
  const build = () => trPick(set.scope, set.n).map(c => trChallenge(c, set));
  startSession({ q: first.map(c => trChallenge(c, set)), hearts: false, trainer: true, rebuild: build });
}

/* --- lenient check of a typed Russian translation --- */
const RU_STOP = new Set(["во", "на", "со", "по", "от", "ко", "об", "обо", "за", "из", "до", "для", "при", "не", "ни", "но", "же", "ли", "бы", "или", "либо", "что", "как", "то", "это", "так", "его", "её", "ее", "их", "сам", "себя", "себе", "свой", "свою", "своё", "свое", "свои", "др", "ед", "мн", "перен", "разг", "букв", "амер", "брит", "англ"]);
const ruTokens = s => String(s).toLowerCase().replace(/ё/g, "е").replace(/[а-я]+-л\.?/g, " ").replace(/[^a-zа-я0-9]+/g, " ").split(" ").filter(w => w.length > 1 && !RU_STOP.has(w));
const ruExpand = ru => ru.replace(/\((не|без|бес)\)([а-яё]+)/gi, "$2 / $1$2").replace(/\((ся|сь)\)/g, "");
/* "не" is a stop word for matching, so negation is compared separately: "суметь" must not pass for "не суметь" */
const NEG_RE = /(^|[^а-яё])не\s/;
const hasNeg = s => NEG_RE.test(String(s).toLowerCase());
function ruVariants(full) {
  const left = full.split("≠")[0].replace(/\([^)]*\)/g, " ").replace(/[«»"“”]/g, " ");
  return left.split(/[;,\/—–!?]|\s-\s/).map(raw => ({ t: ruTokens(raw), neg: hasNeg(raw) })).filter(v => v.t.length);
}
function ruWordMatch(a, b) {
  if (a === b) return true;
  const m = Math.min(a.length, b.length);
  let cp = 0; while (cp < m && a[cp] === b[cp]) cp++;
  if (cp >= 3 && cp >= m - 3 && cp >= Math.ceil(m * 0.6) && Math.abs(a.length - b.length) <= 3) return true;
  return m >= 6 && Math.abs(a.length - b.length) <= 1 && lev(a, b) <= 1;
}
const isInf = w => /(ть|ться|ти|тись|чь|чься)$/.test(w);
function ruJudge(input, c) {
  const it = ruTokens(input);
  if (!it.length) return false;
  const full = ruExpand(c.ru);
  const all = ruTokens(full);
  if (!it.every(w => all.some(x => ruWordMatch(w, x)))) return false;
  const inNeg = hasNeg(input);
  return ruVariants(full).some(v => {
    if (v.neg !== inNeg) return false;
    const vt = v.t;
    const hit = vt.filter(x => it.some(w => ruWordMatch(w, x))).length;
    if (hit / vt.length >= 0.6) return true;
    const verbs = vt.filter(isInf);
    return verbs.length > 0 && it.length <= 3 && verbs.some(v => it.some(w => ruWordMatch(w, v)));
  });
}

function startSprint() {

  const seen = pool.filter(c => rec(c)); const use = (seen.length >= 20 ? seen : pool).slice();
  let score = 0, left = 60, timer = 0, over = false;
  closeSheet();
  let el = $("#lesson"); if (!el) { el = node('<div id="lesson" class="lesson"></div>'); D.body.append(el); }
  el.hidden = false; D.body.style.overflow = "hidden";
  el.innerHTML = `<div class="l-head"><div class="wrap"><button class="l-close" id="sp-close" aria-label="Закрыть">${icon("x")}</button><div class="sprint-time"><span id="sp-t" style="width:100%"></span></div><div class="sprint-score" id="sp-s">0</div></div></div>
    <div class="l-body"><div class="wrap" id="sp-main"><h2 class="ch-title">Спринт: найдите пары</h2><div class="match" id="sp-board"><div class="match-col"></div><div class="match-col"></div></div></div></div>
    <div class="l-foot"><div class="wrap"><p class="muted small" style="text-align:center">Каждая верная пара — очко. Ошибка отнимает 2 секунды.</p></div></div>`;
  $("#sp-close").onclick = () => { clearInterval(timer); el.hidden = true; el.innerHTML = ""; D.body.style.overflow = ""; App.refresh(); };
  const [colL, colR] = $$("#sp-board .match-col");
  const slotsL = [], slotsR = [];
  let queue = use.slice(), active = [], selL = null, selR = null, pending = 0;
  const take = () => { if (!queue.length) queue = shuffle(use.slice()); return queue.shift(); };
  const mkT = (c, side) => {
    const b = node(`<button class="mtile" type="button" lang="${side === "L" ? "en" : "ru"}">${esc(side === "L" ? c.clean : ruOpt(c))}</button>`);
    b.dataset.id = c.id;
    b.onclick = () => {
      if (over || b.classList.contains("gone")) return;
      if (side === "L") { if (selL) selL.classList.remove("sel"); selL = b; Speech.say(c.say); } else { if (selR) selR.classList.remove("sel"); selR = b; }
      b.classList.add("sel");
      if (selL && selR) {
        const a = selL, z = selR; selL = selR = null;
        a.classList.remove("sel"); z.classList.remove("sel");
        if (a.dataset.id === z.dataset.id) {
          score++; $("#sp-s").textContent = score; Sfx.play("tap");
          a.classList.add("gone"); z.classList.add("gone"); pending++;
          if (pending >= 2 || $$(".mtile:not(.gone)", colL).length < 3) refill();
        } else {
          left = Math.max(0, left - 2); [a, z].forEach(x => { x.classList.add("no"); setTimeout(() => x.classList.remove("no"), 420); }); Sfx.play("bad");
        }
      }
    };
    return b;
  };
  function refill() {
    pending = 0;
    const goneL = $$(".mtile.gone", colL), goneR = $$(".mtile.gone", colR);
    const fresh = goneL.map(() => take());
    const rs = shuffle(fresh.slice());
    goneL.forEach((g, i) => g.replaceWith(mkT(fresh[i], "L")));
    goneR.forEach((g, i) => g.replaceWith(mkT(rs[i], "R")));
  }
  const first = [take(), take(), take(), take(), take()];
  first.forEach(c => colL.append(mkT(c, "L")));
  shuffle(first.slice()).forEach(c => colR.append(mkT(c, "R")));
  timer = setInterval(() => {
    left -= 0.1; $("#sp-t").style.width = Math.max(0, left / 60 * 100) + "%";
    if (left <= 0 && !over) {
      over = true; clearInterval(timer);
      const best = Math.max(P.sprint || 0, score); const isBest = score > (P.sprint || 0);
      P.sprint = best; const xp = Math.round(score / 2);
      if (xp > 0) P.days[dayKey()] = todayXP() + xp;
      commit(); Sfx.play("done");
      $("#sp-main").innerHTML = `<div class="results"><div class="res-art">${icon("timer")}</div><h2>${score} ${plural(score, "пара", "пары", "пар")}</h2>
        <p class="muted">${isBest && score > 0 ? "Новый рекорд!" : "Рекорд: " + best}</p>
        <div class="tiles3"><div class="rtile xp"><span class="k">Опыт</span><b>+${xp}</b></div><div class="rtile acc"><span class="k">Пары</span><b>${score}</b></div><div class="rtile time"><span class="k">Рекорд</span><b>${best}</b></div></div></div>`;
      el.querySelector(".l-foot .wrap").innerHTML = `<div class="foot-row"><button class="btn" id="sp-x">Готово</button><button class="btn primary" id="sp-again">Ещё раз</button></div>`;
      $("#sp-x").onclick = () => $("#sp-close").click();
      $("#sp-again").onclick = startSprint;
    }
  }, 100);
}

function nodeState(nd) {
  if (nd.k === "skill") {
    const cs = SKILL[nd.id];
    const seen = cs.filter(c => rec(c)).length;
    const prog = cs.reduce((s, c) => { const r = rec(c); return s + (r ? (1 + Math.min(r.b, 3)) / 4 : 0); }, 0) / cs.length;
    return { done: seen === cs.length, gold: cs.every(c => (rec(c) || {}).b >= 3), prog, seen, total: cs.length, learned: learnedCount(cs) };
  }
  if (nd.k === "ex") {
    const done = nd.ex.every(id => (P.ex[id] || {}).n > 0);
    const prog = nd.ex.reduce((s, id) => s + ((P.ex[id] || {}).b || 0), 0) / (nd.ex.length * 100);
    return { done, gold: nd.ex.every(id => ((P.ex[id] || {}).b || 0) >= 90), prog };
  }
  const b = P.chk[nd.id] || 0;
  return { done: b >= 80, gold: b >= 95, prog: b / 100, best: b };
}

      <button class="btn" id="r-flash" ${scopeCards.length ? "" : "disabled"}>Карточки · ${Math.min(20, scopeCards.length)} шт.</button></div>

function drawDict() {
  const st = App.dict, list = $("#dict-list"); if (!list) return;
  if (dictIO) { dictIO.disconnect(); dictIO = null; }
  const q = normS(st.q.trim());
  const flat = st.st === "mis";
  let cs = ACT.filter(c => {
    if (st.unit !== "all" && c.unit !== +st.unit) return false;
    if (st.skill && c.skill !== st.skill) return false;
    const s = status(c);
    if (st.st === "new" && s !== "new") return false;
    if (st.st === "learning" && s !== "learning") return false;
    if (st.st === "learned" && !(s === "learned" || s === "mastered")) return false;
    if (st.st === "mis" && !misCount(c)) return false;
    if (st.st === "fav" && !isFav(c)) return false;
    if (q && !c.search.includes(q)) return false;
    return true;
  });
  if (flat) cs = cs.sort(byMistakes);
  const plainAll = !q && st.st === "all" && st.unit === "all" && !st.skill;
  $("#dict-count").textContent = flat && cs.length ? `Слова с ошибками — сначала самые частые: ${words(cs.length)}` : plainAll ? `Показаны все ${words(cs.length)}` : `Найдено: ${words(cs.length)}`;
  list.innerHTML = "";
  if (!cs.length) { list.innerHTML = `<div class="empty">${flat ? "Ошибок пока нет. Здесь появятся слова, в которых вы ошибались в уроках, повторении или переводе." : "Ничего не найдено. Попробуйте другое слово или снимите фильтры."}</div>`; return; }
  let i = 0, secEl = null, lastSec = "", lastGroup = "";
  const moreBtn = node(`<button class="btn slim dmore" type="button"></button>`);
  const more = () => {
    const end = Math.min(cs.length, i + (i ? 200 : 120));
    let buf = "";
    const flush = () => { if (buf && secEl) secEl.insertAdjacentHTML("beforeend", buf); buf = ""; };
    for (; i < end; i++) {
      const c = cs[i], sec = SEC[c.sec];
      if (flat) { if (!secEl) { secEl = node(`<div class="dsec"></div>`); list.append(secEl); } }
      else if (c.sec !== lastSec) {
        flush();
        secEl = node(`<div class="dsec u${c.unit}"><div class="dsec-h"><h3>Юнит ${c.unit} · ${esc(sec.title)}${sec.sub ? " · " + esc(sec.sub) : ""}</h3><span>${esc(SECTION_PAGES[sec.id] || "")}</span></div></div>`);
        list.append(secEl); lastSec = c.sec; lastGroup = "";
      }
      if (!flat && c.group !== lastGroup && sec.kind !== "pron") { buf += `<div class="dgroup">${esc(c.group)}</div>`; lastGroup = c.group; }
      buf += entryHTML(c, flat);
    }
    flush();
    if (i < cs.length) { moreBtn.textContent = `Показать ещё · осталось ${cs.length - i}`; list.append(moreBtn); if (dictIO) { dictIO.unobserve(moreBtn); dictIO.observe(moreBtn); } }
    else { moreBtn.remove(); if (dictIO) { dictIO.disconnect(); dictIO = null; } }
  };
  moreBtn.onclick = more;
  if ("IntersectionObserver" in window) dictIO = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && i < cs.length) more(); }, { rootMargin: "900px 0px" });
  more();
  list.onclick = e => {
    const en = e.target.closest(".entry"); if (!en) return;
    const c = CARD[en.dataset.id]; if (!c) return;
    const fb = e.target.closest(".fav");
    if (fb) {
      const on = !isFav(c);
      P.fav[c.id] = on ? Date.now() : -Date.now();
      commit();
      fb.setAttribute("aria-pressed", String(on)); fb.innerHTML = icon(on ? "starf" : "star");
      toast(on ? "Добавлено в избранное" : "Убрано из избранного");
      return;
    }
    const mb = e.target.closest(".entry-main"); if (!mb) return;
    const open = $(".entry-more", en);
    if (open) { open.remove(); mb.setAttribute("aria-expanded", "false"); return; }
    const r = rec(c);
    en.append(node(`<div class="entry-more">
        ${c.ipa ? `<div class="ipa">${esc(c.ipa)}</div>` : ""}
        ${c.d ? `<div>${esc(c.d)}</div>` : ""}
        ${c.e ? `<div><em>${esc(c.e)}</em></div>` : ""}
        <div class="lvrow">${lvDots(r ? r.b : 0)}<span>${r ? "уровень " + r.b + " из 5 · " + ST_LABEL[status(c)] + " · верно " + (r.c || 0) + " · ошибок " + (r.w || 0) : "новое слово — ещё не встречалось"}</span></div>
        <div>${fromLine(c)}</div>
      </div>`));
    mb.setAttribute("aria-expanded", "true");
    Speech.say(c.say);
  };
}

    box.append(sec);
  });
  v.append(box);
}

/* --- profile --- */
const ACH = [
  ["Первый урок", "bulb", () => Object.values(P.sk).some(n => n > 0)],
  ["Серия 3 дня", "flame", () => streak() >= 3],
  ["Серия 7 дней", "flame", () => streak() >= 7],
  ["100 XP", "bolt", () => totalXP() >= 100],
  ["1000 XP", "bolt", () => totalXP() >= 1000],
  ["50 слов", "dict", () => learnedCount(CARDS) >= 50],
  ["300 слов", "dict", () => learnedCount(CARDS) >= 300],
  ["Весь глоссарий", "star", () => learnedCount(CARDS) >= CARDS.length],
  ["Первый юнит сдан", "trophy", () => UNITS.some(u => (P.chk["u" + u.n + "c"] || 0) >= 80)],
  ["Все юниты сданы", "trophy", () => UNITS.every(u => (P.chk["u" + u.n + "c"] || 0) >= 80)],
  ["Перевод: 100 ответов", "translate", () => (P.tn || 0) >= 100],
  ["Все упражнения", "book", () => EXERCISES.every(e => (P.ex[e.id] || {}).n > 0)],
  ["Спринт: 20 пар", "timer", () => (P.sprint || 0) >= 20]
];
function viewMe(v) {
  const st = streak(), tot = totalXP(), ln = learnedCount(), ms = ACT.filter(c => status(c) === "mastered").length;
  const week = Array.from({ length: 7 }, (_, i) => addDays(new Date(), i - 6));
  const vals = week.map(d => P.days[dayKey(d)] || 0);
  const max = Math.max(P.set.goal * 1.25, ...vals, 10);
  const dn = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
  const sync = APP_BUILD ? ["device", "Прогресс хранится на этом устройстве. Чтобы перенести его в версию в Claude или на другой телефон, используйте код прогресса.", "local"] : { cloud: ["cloud", "Прогресс сохраняется в вашем аккаунте и доступен на других устройствах.", ""], local: ["device", "Прогресс хранится в этом браузере. Откройте приложение, войдя в аккаунт, чтобы он сохранялся в облаке.", "local"], pending: ["device", "Проверяем сохранение в аккаунте…", "local"], error: ["cloud", "Не удалось сохранить в аккаунт — попробуем снова после следующего урока. Локальная копия на месте.", "local"] }[Cloud.status] || ["device", "", "local"];
  const sw = (id, on, label, sub) => `<div class="setrow"><span>${label}${sub ? `<br><span class="small muted">${sub}</span>` : ""}</span><button class="switch" role="switch" id="${id}" aria-checked="${!!on}" aria-label="${esc(label)}"></button></div>`;
  const box = node(`<div class="view">
    <div class="view-head"><h1>Профиль</h1><p>Статистика — ${esc(unitsLabel())}. Опыт, серия и достижения — общие для всего курса.</p></div>
    ${unitsBarHTML()}
    <div class="stats4">
      <div class="stile"><span style="color:var(--u2)">${icon("flame")}</span><div><b>${st}</b><span>${plural(st, "день", "дня", "дней")} подряд</span></div></div>
      <div class="stile"><span style="color:var(--spark-deep)">${icon("bolt")}</span><div><b>${tot}</b><span>всего XP</span></div></div>
      <div class="stile"><span style="color:var(--ok)">${icon("dict")}</span><div><b>${ln}<span class="small muted">/${ACT.length}</span></b><span>выучено</span></div></div>
      <div class="stile"><span style="color:var(--blue)">${icon("star")}</span><div><b>${ms}</b><span>освоено (5/5)</span></div></div>
    </div>
    <div class="card"><div class="week-head"><h3>Опыт за неделю</h3><span class="legend"><i></i>цель ${P.set.goal} XP</span></div>
      <div class="week" role="img" aria-label="Опыт за 7 дней: ${vals.join(", ")}">
        <div class="goal-line" style="bottom:${22 + Math.round((P.set.goal / max) * 90)}px"></div>
        ${week.map((d, i) => `<div class="wcol"><span class="v">${vals[i] || ""}</span><div class="wbar ${vals[i] ? (vals[i] >= P.set.goal ? "hit" : "") : "zero"}" style="height:${Math.max(3, Math.round(vals[i] / max * 90))}px"></div><small>${dn[d.getDay()]}</small></div>`).join("")}
      </div></div>
    <div class="card"><h3>Цель на день</h3>
      <div class="seg" role="group" aria-label="Цель на день">${[[10, "Лёгкая"], [20, "Обычная"], [30, "Серьёзная"], [50, "Интенсив"]].map(([g, l]) => `<button class="chip" data-goal="${g}" aria-pressed="${P.set.goal === g}">${l} · ${g} XP</button>`).join("")}</div></div>
    <div class="card"><h3>Настройки</h3>
      ${sw("s-sound", P.set.sound, "Звуковые эффекты")}
      ${sw("s-hearts", P.set.hearts, "Сердечки в уроках", "5 ошибок — и урок начинается заново")}
      ${Speech.ok ? `<div class="setrow stack"><span>Произношение</span><div class="seg"><button class="chip" data-acc="gb" aria-pressed="${P.set.accent === "gb"}">Британское</button><button class="chip" data-acc="us" aria-pressed="${P.set.accent === "us"}">Американское</button></div></div>
      <div class="setrow stack"><span>Скорость речи</span><div class="seg">${[[0.8, "0.8×"], [1, "1×"], [1.15, "1.15×"]].map(([r, l]) => `<button class="chip" data-rate="${r}" aria-pressed="${P.set.rate === r}">${l}</button>`).join("")}</div></div>
      <button class="btn slim" id="s-test" type="button" style="justify-self:start">${icon("speaker", "sm")} Проверить звук</button>` : `<p class="small muted">Этот браузер не умеет озвучивать текст, поэтому задания на аудирование отключены.</p>`}
    </div>
    <div class="card"><h3>Достижения</h3><div class="ach">${ACH.map(([t, ic, f]) => `<div class="badge-a ${f() ? "on" : ""}"><span class="mode-ico">${icon(ic)}</span>${esc(t)}</div>`).join("")}</div></div>
    <div class="card"><h3>Сохранение и перенос</h3>
      <div class="sync ${sync[2]}">${icon(sync[0])}<span>${sync[1]}</span></div>
      <p class="small muted">Код прогресса переносит выученные слова, ошибки, опыт и настройки между версией в Claude и приложением на телефоне. Прогресс объединяется, ничего не теряется.</p>
      <div class="seg"><button class="btn slim" id="s-export" type="button">Скопировать код прогресса</button><button class="btn slim" id="s-import" type="button">Вставить код</button></div>
      <button class="btn slim" id="s-reset" type="button" style="justify-self:start">Сбросить прогресс</button></div>
    <p class="small muted">Глоссарий и упражнения — по учебнику О. А. Акимовой, И. В. Горшковой, Н. Э. Шарабариной «Английский язык для предпринимателей. English for Entrepreneurs (B1–B2)», юниты 1–8. Переводы, определения и примеры предложений написаны для этого тренажёра.</p>
  </div>`);
  v.append(box);
  bindUnits(box);
  const setS = (k, val) => { P.set[k] = val; P.set.t = Date.now(); commit(); };
  $$("[data-goal]", box).forEach(b => b.onclick = () => { setS("goal", +b.dataset.goal); App.refresh(); });
  const tog = (id, k) => { const b = $("#" + id, box); b.onclick = () => { setS(k, !P.set[k]); b.setAttribute("aria-checked", String(!!P.set[k])); }; };
  tog("s-sound", "sound"); tog("s-hearts", "hearts");
  $$("[data-acc]", box).forEach(b => b.onclick = () => { setS("accent", b.dataset.acc); App.refresh(); Speech.say("Entrepreneurship is the art of turning challenges into success stories."); });
  $$("[data-rate]", box).forEach(b => b.onclick = () => { setS("rate", +b.dataset.rate); App.refresh(); Speech.say("Entrepreneurship"); });
  const tst = $("#s-test", box); if (tst) tst.onclick = () => { Speech.say("My word is my bond."); if (!Speech.voices.length) toast("Английский голос не найден — проверьте настройки речи на устройстве"); };
  /* the code is prepared ahead, so copying can happen right inside the tap (Safari requires that) */
  let codeCache = null;
  progressCode().then(c => { codeCache = c; }).catch(() => { /* prepared again on tap */ });
  const showCode = code => sheet(`<h3>Код прогресса</h3><p class="meta">Скопируйте код целиком и вставьте его в другой версии тренажёра: «Профиль» → «Вставить код».</p>
      <textarea class="inp codebox" id="exp-code" readonly rows="6" aria-label="Код прогресса">${esc(code)}</textarea>

    copy: () => {

    const code = codeCache;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => toast("Код скопирован — вставьте его в другой версии"), () => showCode(code));
    else showCode(code);

  $("#s-import", box).onclick = () => sheet(`<h3>Вставить код прогресса</h3><p class="meta">Вставьте код, скопированный в другой версии тренажёра. Прогресс объединится с текущим.</p>
      <textarea class="inp codebox" id="imp-code" rows="5" placeholder="VE1…" aria-label="Код прогресса" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>

      const err = $("#imp-err");
      try {
        const obj = await readCode($("#imp-code").value);
        P = merge(P, obj); commit(); closeSheet();
        toast("Прогресс перенесён: " + words(Object.keys(P.cards).length) + " в работе");
        App.refresh(true);
      } catch (e) {
        err.hidden = false;
        err.textContent = e && e.message === "gzip" ? "Этот браузер не умеет распаковывать код. Обновите iOS или браузер и попробуйте снова." : "Код не распознан. Скопируйте его целиком — он начинается с VE1.";

  $("#s-reset", box).onclick = () => sheet(`<h3>Сбросить весь прогресс?</h3><p class="meta">Удалятся выученные слова, XP, серия и результаты упражнений${Cloud.status === "cloud" ? " — на всех устройствах" : ""}. Отменить это нельзя.</p>
      <div class="sheet-actions"><button class="btn" data-a="no">Отмена</button><button class="btn badb" data-a="yes">Сбросить</button></div>`,
    { no: closeSheet, yes: () => { const keep = P.set; P = blank(); P.set = keep; P.r = Date.now(); closeSheet(); commit(); toast("Прогресс сброшен"); App.refresh(true); } });
}

}
function start(data) {
  if (data && data.P) { try { P = merge(P, data.P); saveLocal(); } catch (e) { /* ignore */ } }
  Speech.init();
  shell();
  let tab = "learn";
  const hashTab = (location.hash || "").replace("#", "");
  if (TABS.some(t => t[0] === hashTab)) tab = hashTab;
  else { try { const t = localStorage.getItem(KEY + "-tab"); if (TABS.some(x => x[0] === t)) tab = t; } catch (e) { /* none */ } }
  App.go(tab);
  Cloud.init();
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === "function") { try { hot.snapshot(() => ({ P })); } catch (e) { /* none */ } }
if (hot && typeof hot.ready === "function") hot.ready(start); else start((hot && hot.data) || {});
window.__VE = { cards: CARDS.length, cur: () => L.s && L.s.cur };
if (location.protocol === "file:") window.__VE.dbg = { CARDS, distractors, buildSkillLesson, buildCheck, buildExercise, buildReviewLesson, PREPS, SKILL, NODES, EX, act: () => ACT, applyUnits, selUnits, trBase, trPick, trChallenge, ruJudge, ruVariants, startTrainer, P: () => P, rec };
})();
